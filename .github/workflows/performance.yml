name: Performance

# Purge program: the deleted seed tooling this workflow depended on is gone
# (perf seed removed with the old chain client). Manual runs only until
# the 4.4/5.6 perf rework rebuilds seeding + k6 scenarios against Arc.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6-top-five:
    name: k6 top five endpoint SLOs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deodes_perf
          POSTGRES_USER: deodes
          POSTGRES_PASSWORD: deodes_perf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deodes -d deodes_perf"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEODES_DATABASE_URL: postgres://deodes:deodes_perf@localhost:5432/deodes_perf?sslmode=disable
      DEODES_REDIS_URL: redis://localhost:6379
      DEODES_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      DEODES_WALLET_PEPPER: performance-only-wallet-pepper
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      DEODES_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: grafana/setup-k6-action@v1

      - name: Generate isolated test keys
        shell: bash
        run: |
          openssl genrsa -out /tmp/perf-jwt-private.pem 2048
          openssl rsa -in /tmp/perf-jwt-private.pem -pubout -out /tmp/perf-jwt-public.pem
          {
            echo 'JWT_PRIVATE_KEY<<PERF_PRIVATE_EOF'
            cat /tmp/perf-jwt-private.pem
            echo 'PERF_PRIVATE_EOF'
            echo 'JWT_PUBLIC_KEY<<PERF_PUBLIC_EOF'
            cat /tmp/perf-jwt-public.pem
            echo 'PERF_PUBLIC_EOF'
          } >> "$GITHUB_ENV"
          # Seed tooling purged — the API boots keyless (no master
          # keys required). Perf seeding returns in the 4.4/5.6 rework.

      - name: Migrate local stack
        shell: bash
        run: |
          go run ./cmd/migrate --direction up
          # DB/API seeding returns in the 4.4/5.6 perf rework (the old
          # seed tool was purged). k6 below runs against public endpoints only.
          echo "ACCESS_TOKEN=" >> "$GITHUB_ENV"

      - name: Start API
        shell: bash
        run: |
          go run ./cmd/api-server > /tmp/deodes-perf-api.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:1100/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/deodes-perf-api.log
          exit 1

      - name: Assert p95 SLOs
        env:
          BASE_URL: http://127.0.0.1:1100
          K6_VUS: "2"
          K6_DURATION: 15s
        run: k6 run tests/performance/top5.js

      - name: Print API logs on failure
        if: failure()
        run: cat /tmp/deodes-perf-api.log || true
